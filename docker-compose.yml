services:
  # --- 1. 连接器: NapCatQQ (协议端) ---
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always
    environment:
      - ACCOUNT=      # 首次启动留空，使用扫码登录
      - WS_ENABLE=true
      - HTTP_ENABLE=true
      # 映射当前用户ID (通常是1000)，防止生成 root 权限的文件无法编辑
      - NAPCAT_UID=1000
      - NAPCAT_GID=1000
      - TZ=Asia/Shanghai
    ports:
      - "6099:6099"   # WebUI 管理端口
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/qq:/app/.config/QQ  # 关键！持久化登录凭证
    # --- 专家配置: 资源限制 ---
    # 防止 Electron 内存泄漏卡死树莓派
    deploy:
      resources:
        limits:
          memory: 1G
    # --- 专家配置: 日志轮转 ---
    # 防止 Docker 日志写满 SD 卡
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- 2. 大脑: NoneBot2 (逻辑端) ---
  nonebot:
    # ✅ 改回自动构建，但加上 network: host 来解决 DNS 问题
    build:
      context: ./nonebot
      network: host      # 关键！这行能让构建过程直接连网，不再报 DNS 错
    
    image: qq-bot-image:latest
    container_name: nonebot
    restart: always
    command: /bin/sh -c "nb orm upgrade && python bot.py"
    env_file:
      - .env
    environment:
      - DRIVER=~fastapi
      - HOST=0.0.0.0  # 必须监听 0.0.0.0 以供 NapCat 连接
      - PORT=8080
      - TZ=Asia/Shanghai
      # 👇 必须添加这行配置！
      # 这会创建一个叫 db.sqlite3 的文件在你的 /data 目录下 (因为你挂载了 /data)
      - SQLALCHEMY_DATABASE_URL=sqlite+aiosqlite:////data/db.sqlite3
    volumes:
      - ./nonebot/plugins:/app/plugins  # 挂载插件目录，方便热更新代码
      - ./nonebot_data:/data            # 挂载数据目录
    depends_on:
      - napcat
    # 允许反向连接
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
